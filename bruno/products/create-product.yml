info:
  name: Crear Producto
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/products
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "RGB",
        "description": "Teclado mecanico para desarrollo y gaming",
        "price": 120000,
        "stock": 15,
        "state": "disponible",
        "category": "6ad798333f449dd0fdbcf25b"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
