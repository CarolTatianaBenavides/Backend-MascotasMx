info:
  name: Listar Usuarios (Paginado y Filtro Status)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/users"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: status
      value: "true"
      type: query
