info:
  name: Crear Categoria
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/categories
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "Tecnologia",
        "description": "Articulos y dispositivos tecnologicos",
        "status": true,
        "createdBy": "6ad7975c3f449dd0fdbcf258"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
